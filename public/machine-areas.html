<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Winding Machines — Factory Manager</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-text">
          <div class="brand-title">Winding Machines</div>
          <div class="brand-sub">Permanent kiosk URLs — one machine per tablet</div>
        </div>
        <nav class="nav">
          <a href="/manager-dashboard">Manager</a>
          <a href="/">Dashboard</a>
        </nav>
        <button id="logoutBtn" class="btn btn-sm" type="button">Logout</button>
      </div>
    </header>
    <main class="container manager-layout">
      <section class="card manager-card">
        <div class="card-header">
          <div class="card-header-main">
            <h2 class="card-title">Add machine</h2>
            <p class="card-kicker">Enter the machine name only. A kiosk slug and URL are generated automatically.</p>
          </div>
        </div>
        <div class="card-body manager-form-grid manager-form-grid-2">
          <div class="field">
            <label for="newMachineName">Machine name</label>
            <input id="newMachineName" type="text" placeholder="Winding Machine 04" autocomplete="off" />
          </div>
          <button id="btnAddMachine" class="btn btn-primary manager-form-action-btn" type="button">Add machine</button>
        </div>
        <div class="toastline manager-alert" id="machineHint"></div>
      </section>
      <section class="card manager-card">
        <div class="card-header"><h2 class="card-title">Configured machines</h2></div>
        <div class="card-body card-body--flush">
          <div class="table-wrap table-scroll manager-table-wrap">
            <table class="manager-table">
              <thead>
                <tr><th>Machine name</th><th>Kiosk URL</th><th>Active</th><th>Sort</th><th></th></tr>
              </thead>
              <tbody id="machinesBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
    <script src="/machine-areas.js"></script>
  </body>
</html>
