<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bulkhead Inventory — Factory Manager</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .di-tools { display: grid; gap: 10px; padding: 12px 16px; }
      .di-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .di-row label { display: inline-block; width: auto; margin: 0 4px 0 0; font-weight: 700; color: #334155; }
      .di-row select.di-select { width: auto; min-width: 160px; }
      #hint:empty { display: none; }
      .di-search { flex: 1 1 260px; min-height: 44px; font-size: 1rem; padding: 6px 12px; border: 1px solid #94a3b8; border-radius: 10px; }
      .di-select { min-height: 44px; font-size: 1rem; padding: 4px 8px; border-radius: 10px; }
      .di-chip {
        min-height: 40px; min-width: 56px; padding: 4px 12px; border: 2px solid #cbd5e1; border-radius: 999px; background: #fff;
        font: inherit; font-weight: 800; color: #1e3a5f; cursor: pointer;
      }
      .di-chip.is-on { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
      .di-total { display: inline-flex; gap: 6px; align-items: baseline; }
      .di-total strong { font-size: 1.1rem; }
      .di-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 800; white-space: nowrap; }
      .di-badge--available { background: #dcfce7; color: #166534; }
      .di-badge--assigned { background: #dbeafe; color: #1e40af; }
      .di-badge--installed { background: #e2e8f0; color: #334155; }
      .di-badge--not_in_inventory { background: #fef3c7; color: #92400e; }
      .di-table td, .di-table th { white-space: nowrap; }
      .di-table td.di-num { font-weight: 800; }
      .di-table tr { cursor: pointer; }
      .di-modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; z-index: 80; padding: 16px; }
      .di-modal.show { display: flex; }
      .di-modal-card { background: #fff; border-radius: 14px; padding: 18px; width: min(560px, 100%); max-height: 92vh; overflow-y: auto; display: grid; gap: 12px; }
      .di-modal-card--wide { width: min(860px, 100%); }
      .di-modal-card h3 { margin: 0; }
      .di-modal-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
      .di-modal-actions .btn { min-height: 44px; min-width: 110px; }
      .di-grid { display: grid; gap: 8px 16px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
      .di-grid .k { font-size: 0.78rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.03em; }
      .di-grid .v { font-weight: 700; color: #0f172a; overflow-wrap: anywhere; }
      .di-section h4 { margin: 8px 0 6px; }
      .di-list { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
      .di-form { display: grid; gap: 10px; }
      .di-form .field input, .di-form .field select, .di-form .field textarea { min-height: 44px; font-size: 1rem; }
      .di-hint { margin: 0; color: #b91c1c; font-weight: 700; min-height: 1.2em; }
      .topbar .lang-select-label { display: inline-flex; gap: 6px; align-items: center; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-text">
          <div class="brand-title" data-i18n="bi.title">Bulkhead Inventory</div>
          <div class="brand-sub" data-i18n="bi.sub">Bulkheads built in the Dome Shop or added manually.</div>
        </div>
        <nav class="nav">
          <a href="/manager-dashboard" data-i18n="di.back">← Manager Dashboard</a>
          <a href="/dome-inventory" data-i18n="di.nav">Dome Inventory</a>
        </nav>
        <span id="managerLangMount"></span>
        <button id="logoutBtn" class="btn btn-sm" type="button">Logout</button>
      </div>
    </header>
    <main class="container manager-layout">
      <section class="card manager-card">
        <div class="card-header">
          <div class="card-header-main">
            <h2 class="card-title" data-i18n="bi.title">Bulkhead Inventory</h2>
          </div>
          <div class="di-row">
            <button type="button" class="btn" id="btnRefresh" data-i18n="di.refresh">Refresh</button>
            <button type="button" class="btn btn-primary" id="btnAdd" data-i18n="bi.add">Add Existing Bulkhead</button>
          </div>
        </div>
        <div class="di-tools">
          <div class="di-row" id="totals"></div>
          <div class="di-row">
            <input id="search" class="di-search" type="search" autocomplete="off" data-i18n-placeholder="bi.searchPh" placeholder="Search bulkhead or tank number…" />
          </div>
          <div class="di-row">
            <label for="statusFilter" data-i18n="di.filter.status">Status</label>
            <select id="statusFilter" class="di-select"></select>
            <span id="countLabel" class="muted"></span>
          </div>
        </div>
        <div class="toastline manager-alert" id="hint"></div>
        <div class="card-body card-body--flush">
          <div class="table-wrap table-scroll manager-table-wrap">
            <table class="manager-table di-table">
              <thead>
                <tr>
                  <th data-i18n="bi.field.number">Bulkhead Number</th>
                  <th data-i18n="bi.col.type">Type</th>
                  <th data-i18n="bi.col.diameter">Diameter</th>
                  <th data-i18n="bi.col.weight">Weight</th>
                  <th data-i18n="dome.field.production">Production</th>
                  <th data-i18n="dome.field.inventory">Inventory</th>
                  <th data-i18n="bi.col.tank">Tank</th>
                  <th data-i18n="dome.field.created">Created</th>
                  <th data-i18n="dome.field.completed">Completed</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="bulkheadsBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <div id="detailsModal" class="di-modal" role="dialog" aria-modal="true" aria-labelledby="detailsTitle" hidden>
      <div class="di-modal-card di-modal-card--wide">
        <h3 id="detailsTitle"></h3>
        <div id="detailsBody"></div>
        <div class="di-modal-actions">
          <button type="button" class="btn btn-danger" id="btnDetailsDelete" data-i18n="bi.delete">Delete Bulkhead</button>
          <button type="button" class="btn" id="btnDetailsEdit" data-i18n="di.edit">Edit</button>
          <button type="button" class="btn btn-primary" id="btnDetailsClose" data-i18n="dome.close">Close</button>
        </div>
      </div>
    </div>

    <div id="deleteModal" class="di-modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle" hidden>
      <div class="di-modal-card">
        <h3 id="deleteTitle" data-i18n="bi.delete.title">Delete Bulkhead</h3>
        <p id="deleteIntro" class="muted" style="margin:0"></p>
        <div class="di-form">
          <div class="field">
            <label for="deleteConfirm" data-i18n="bi.delete.confirmLabel">Type the Bulkhead Number to confirm</label>
            <input id="deleteConfirm" type="text" maxlength="60" autocomplete="off" />
          </div>
        </div>
        <p id="deleteHint" class="di-hint"></p>
        <div class="di-modal-actions">
          <button type="button" class="btn" id="btnDeleteCancel" data-i18n="dome.cancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="btnDeleteConfirm" data-i18n="di.delete.confirm">Delete</button>
        </div>
      </div>
    </div>

    <div id="formModal" class="di-modal" role="dialog" aria-modal="true" aria-labelledby="formTitle" hidden>
      <div class="di-modal-card">
        <h3 id="formTitle"></h3>
        <p id="formIntro" class="muted" style="margin:0"></p>
        <div class="di-form">
          <div class="field">
            <label for="fNumber" data-i18n="bi.field.number">Bulkhead Number</label>
            <input id="fNumber" type="text" maxlength="60" autocomplete="off" />
          </div>
          <div class="field">
            <label for="fType" data-i18n="dome.field.type">Type</label>
            <select id="fType">
              <option value="">—</option>
              <option value="Petro">Petro</option>
              <option value="Water">Water</option>
            </select>
          </div>
          <div class="field">
            <label for="fDiameter" data-i18n="dome.field.diameter">Diameter</label>
            <select id="fDiameter">
              <option value="">—</option>
              <option value="4">4'</option>
              <option value="6">6'</option>
              <option value="8">8'</option>
              <option value="10">10'</option>
              <option value="12">12'</option>
            </select>
          </div>
          <div class="field">
            <label for="fWeight" data-i18n="dome.field.weightLb">Weight (lb)</label>
            <input id="fWeight" type="text" inputmode="decimal" maxlength="12" autocomplete="off" />
          </div>
          <div class="field">
            <label for="fNotes" data-i18n="dome.field.notes">Notes</label>
            <textarea id="fNotes" rows="2" maxlength="1000"></textarea>
          </div>
        </div>
        <p id="formHint" class="di-hint"></p>
        <div class="di-modal-actions">
          <button type="button" class="btn" id="btnFormCancel" data-i18n="dome.cancel">Cancel</button>
          <button type="button" class="btn btn-primary" id="btnFormSave" data-i18n="dome.save">Save</button>
        </div>
      </div>
    </div>

    <script src="/i18n.js"></script>
    <script src="/dome-i18n.js?v=14"></script>
    <script src="/bulkhead-inventory.js?v=2"></script>
  </body>
</html>
